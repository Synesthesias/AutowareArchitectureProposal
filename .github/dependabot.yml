version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 1
  - package-ecosystem: docker
    directories:
    - /docker/base
    - /docker/pre-built
    schedule:
      interval: weekly
      day: monday
      time: '10:00'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 3
    groups:
      routine-updates:
        patterns:
        - '*'
        update-types:
        - minor
        - patch
      security-updates:
        applies-to: security-updates
        patterns:
        - '*'
